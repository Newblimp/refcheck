<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reference Sign Checker</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#282828" />
    <script>
      // The saved theme, before the app mounts, so there is no flash.
      var t = 'dark';
      try {
        t = localStorage.getItem('rsc_theme') || t;
        if (t === 'system')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {
        t = 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    </script>
  </head>
  <body>
    <!-- #root stays empty on purpose: a static shell measured ~20 ms SLOWER to
         first paint (see CLAUDE.md). HTML comments are stripped by the build. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
