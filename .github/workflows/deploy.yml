name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Run the test suite (and a build) on every push and pull request.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Build and publish to GitHub Pages from main. workflow_dispatch deploys too,
  # so a deployment the Pages queue dropped can be retried from the Actions tab
  # without an empty commit. Without it "Run workflow" ran the tests, skipped
  # this job and reported the whole run green, having published nothing.
  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      # The artifact name is scoped to the run ATTEMPT. Artifacts belong to the
      # run, not the attempt, so re-running this job uploaded a second
      # "github-pages" beside the first and deploy-pages then refused to choose
      # between them ("Multiple artifacts named github-pages … count is 3").
      # A re-run is exactly what a transient Pages failure calls for, so it has
      # to be repeatable.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # Two of three deployments have stalled in the Pages queue past the
          # 10-minute default, which cancels a deployment that would otherwise
          # have landed. The action only polls while it waits, so a higher
          # ceiling costs nothing and rides the queue out instead.
          timeout: 1800000 # 30 minutes (default 600000)
