name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Run the test suite (and a build) on every push and pull request.
  test:
    runs-on: ubuntu-latest
    # vite.config.js defaults to a root-domain base; GitHub Pages serves this
    # repo as a project site under /refcheck/, so only THIS workflow's builds
    # need to override it. A host that deploys from the default branch as-is
    # (Cloudflare, etc.) gets the root-relative default with no config needed.
    env:
      VITE_BASE: /refcheck/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # tsc over src/, build/ and the service worker (three projects — see
      # tsconfig*.json). The app is TypeScript throughout, so this is the gate on
      # every shape in it, not a nice-to-have.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Payload budget. The test suite guards how long extraction takes; nothing
      # guarded how much the app ships, which is where the real cost turned out
      # to be — 95.8 KB of web font, more than the framework and the application
      # together, invisible to every test. Fails the build if the critical path
      # or the precached shell grows past its ceiling.
      - run: npm run budget

  # Build and publish to GitHub Pages from main. workflow_dispatch deploys too,
  # so a deployment the Pages queue dropped can be retried from the Actions tab
  # without an empty commit. Without it "Run workflow" ran the tests, skipped
  # this job and reported the whole run green, having published nothing.
  deploy:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_BASE: /refcheck/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      # The artifact name is scoped to the run ATTEMPT. Artifacts belong to the
      # run, not the attempt, so re-running this job uploaded a second
      # "github-pages" beside the first and deploy-pages then refused to choose
      # between them ("Multiple artifacts named github-pages … count is 3").
      # A re-run is exactly what a transient Pages failure calls for, so it has
      # to be repeatable.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # No `timeout:` here — it cannot help. deploy-pages clamps the input
          # to MAX_TIMEOUT = 600000 (`Math.min(timeoutInput, MAX_TIMEOUT)` in
          # src/internal/deployment.js), so a larger value is silently reduced
          # to the same 10 minutes and only adds a warning to the log. When the
          # Pages queue leaves a deployment in deployment_queued past that, the
          # action aborts and the fix is to run this workflow again — which is
          # what the workflow_dispatch trigger above is for.
